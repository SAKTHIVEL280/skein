<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="64" height="64">
  <!-- Skein mark: one thread drawn as an S, its loose end a single knot.
       White disc with a black rim, transparent outside, so it reads on light
       and dark desktops alike. Flat: two colours, no gradients. -->
  <circle cx="256" cy="256" r="234" fill="#ffffff" stroke="#0a0a0a" stroke-width="32"/>
  <path d="M 326 150 H 216 A 53 53 0 0 0 216 256 H 296 A 53 53 0 0 1 296 362 H 178"
        fill="none" stroke="#0a0a0a" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="384" cy="150" r="24" fill="#0a0a0a"/>
</svg>
